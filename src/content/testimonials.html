<section class="hero">
  <p class="eyebrow">Testimonials</p>
  <h1>How Are We Doing?</h1>
  <p>Leave us a review below — we&rsquo;d love to hear about your experience.</p>
  <a class="btn btn-gold" href="/contact/">Contact Us Today</a>
</section>

<section class="section">
  <div class="narrow">
    <h2>Review Form</h2>
    <form id="review-form" class="form-card" novalidate>
      <div class="form-row hp-field" aria-hidden="true">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required autocomplete="given-name">
      </div>
      <div class="form-row">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name">
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">
      </div>
      <div class="form-row">
        <label for="rating">Rating</label>
        <select id="rating" name="rating" required>
          <option value="">Select a rating</option>
          <option value="5">5 Stars</option>
          <option value="4">4 Stars</option>
          <option value="3">3 Stars</option>
          <option value="2">2 Stars</option>
          <option value="1">1 Star</option>
        </select>
      </div>
      <div class="form-row">
        <label for="message">Your Review</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-gold">Submit Review</button>
      <p class="form-status" role="status"></p>
    </form>
  </div>
</section>

<section class="cta-band">
  <h2>Loved Your Visit?</h2>
  <p>Refer a friend — when they book their first visit, you&rsquo;ll receive a free service on us as a thank-you.</p>
  <a class="btn btn-gold" href="/contact/">Refer a Friend</a>
</section>
